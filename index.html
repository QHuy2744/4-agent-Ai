<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMEGA DESKTOP - Browser Operating System</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
</head>
<body>
    <div id="app-root">
        <div id="desktop-background">
            <div id="app-grid"></div>
        </div>
        <div id="window-container"></div>
        <div id="shell-topbar">
            <div class="tray-left">
                <button id="start-btn" class="tray-btn" aria-label="App Launcher">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                    <span>Omega</span>
                </button>
                <div id="active-tasks-indicator"></div>
            </div>
            <div class="tray-center">
                <div id="system-clock">00:00:00</div>
            </div>
            <div class="tray-right">
                <button id="lock-btn" class="tray-btn" title="Lock Session">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                </button>
                <button id="notif-tray-btn" class="tray-btn" title="Notifications">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                    <span id="notif-badge" class="badge">0</span>
                </button>
                <span id="user-session-pill">Admin</span>
            </div>
        </div>
        <div id="shell-taskbar"></div>
        <div id="launcher-menu" class="hidden">
            <div class="launcher-search">
                <input type="text" id="launcher-search-input" placeholder="Search apps or press Ctrl+K for Command Palette...">
            </div>
            <div class="launcher-apps" id="launcher-apps-list"></div>
        </div>
        <div id="notification-center" class="hidden">
            <div class="notif-header">
                <h3>Notifications</h3>
                <div>
                    <button id="notif-mark-all">Read All</button>
                    <button id="notif-clear">Clear</button>
                </div>
            </div>
            <div id="notif-list"></div>
        </div>
        <div id="lock-screen" class="hidden">
            <div class="lock-box">
                <h2>OMEGA LOCKED</h2>
                <p>Enter PIN (default: 1234)</p>
                <input type="password" id="lock-pin-input" maxlength="6">
                <button id="lock-unlock-btn">Unlock</button>
            </div>
        </div>
        <div id="command-palette" class="hidden">
            <div class="palette-box">
                <input type="text" id="palette-input" placeholder="Type a command (e.g. Create Task, Run Tests)...">
                <div id="palette-results"></div>
            </div>
        </div>
        <div id="global-toast-container"></div>
        <div id="global-error-boundary" class="hidden">
            <div class="error-box">
                <h2>System Exception Caught</h2>
                <p id="error-message"></p>
                <small id="error-id"></small>
                <pre id="error-details" class="hidden"></pre>
                <button onclick="window.location.reload()">Reboot Omega</button>
            </div>
        </div>
    </div>
    <script type="module" src="src/app.js"></script>
</body>
</html>
