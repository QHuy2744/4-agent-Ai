<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS TITAN</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">NEXUS TITAN</div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-view="dashboard">Dashboard</a>
        <a href="#" class="nav-item" data-view="projects">Projects</a>
        <a href="#" class="nav-item" data-view="tasks">Tasks</a>
        <a href="#" class="nav-item" data-view="kanban">Kanban</a>
        <a href="#" class="nav-item" data-view="calendar">Calendar</a>
        <a href="#" class="nav-item" data-view="analytics">Analytics</a>
        <a href="#" class="nav-item" data-view="search">Search</a>
        <a href="#" class="nav-item" data-view="notifications">Notifications</a>
        <a href="#" class="nav-item" data-view="settings">Settings</a>
        <a href="#" class="nav-item" data-view="developer">Developer Panel</a>
      </nav>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-title" id="current-view-title">Dashboard</div>
        <div class="topbar-actions">
          <button class="btn" id="btn-quick-task">+ New Task</button>
        </div>
      </header>
      <div class="content-view" id="main-view-container">
        <!-- Dynamic views rendered here -->
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="command-palette-modal" style="display: none;">
    <div class="modal">
      <h3>Command Palette</h3>
      <input type="text" id="command-input" placeholder="Type a command..." style="width:100%; padding:0.5rem; margin-top:1rem;">
      <div id="command-list" style="margin-top:1rem; max-height:200px; overflow-y:auto;"></div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <!-- Scripts -->
  <script src="storage.js"></script>
  <script src="state.js"></script>
  <script src="tasks.js"></script>
  <script src="projects.js"></script>
  <script src="calendar.js"></script>
  <script src="analytics.js"></script>
  <script src="search.js"></script>
  <script src="commands.js"></script>
  <script src="settings.js"></script>
  <script src="notifications.js"></script>
  <script src="import-export.js"></script>
  <script src="app.js"></script>
</body>
</html>
