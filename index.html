<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giai Điệu Vô Tận - Web Nghe Nhạc Hàng Đầu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="src/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-music"></i>
                <span>MuZic</span>
            </div>
            <ul class="nav-menu">
                <li class="active" data-tab="home">
                    <i class="fa-solid fa-house"></i>
                    <span>Khám Phá</span>
                </li>
                <li data-tab="library">
                    <i class="fa-solid fa-book-bookmark"></i>
                    <span>Thư Viện</span>
                </li>
                <li data-tab="favorites">
                    <i class="fa-solid fa-heart"></i>
                    <span>Yêu Thích</span>
                </li>
            </ul>
            <div class="playlist-section">
                <h3>Playlist của bạn</h3>
                <ul id="user-playlists">
                    <li><span>Nhạc trẻ Hot 2024</span></li>
                    <li><span>Lofi Chill Relax</span></li>
                    <li><span>Remix Sôi Động</span></li>
                </ul>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="Tìm kiếm bài hát, nghệ sĩ...">
                </div>
                <div class="user-profile">
                    <i class="fa-solid fa-bell"></i>
                    <div class="avatar">
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="Avatar">
                    </div>
                </div>
            </header>

            <!-- Banner -->
            <section class="banner">
                <div class="banner-content">
                    <span class="tag">Đề Xuất</span>
                    <h1>Thế Giới Âm Nhạc Trong Tầm Tay</h1>
                    <p>Khám phá hàng triệu bài hát chất lượng cao từ mọi thể loại.</p>
                    <button class="btn-play-all" id="btn-play-all">
                        <i class="fa-solid fa-play"></i> Nghe Ngay
                    </button>
                </div>
            </section>

            <!-- Track List Section -->
            <section class="songs-section">
                <h2>Tất Cả Bài Hạc</h2>
                <div class="song-list-header">
                    <span>#</span>
                    <span>Tiêu đề</span>
                    <span>Album</span>
                    <span><i class="fa-solid fa-clock"></i></span>
                </div>
                <div class="song-list" id="song-list">
                    <!-- Dynamic tracks will be loaded here -->
                </div>
            </section>
        </main>
    </div>

    <!-- Music Player Bar -->
    <div class="music-player">
        <div class="current-song">
            <img id="player-cover" src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=100" alt="Cover">
            <div class="song-info">
                <h4 id="player-title">Chọn bài hát</h4>
                <p id="player-artist">Nghệ sĩ</p>
            </div>
            <i class="fa-regular fa-heart" id="player-heart"></i>
        </div>

        <div class="player-center">
            <div class="player-controls">
                <button id="shuffle-btn" title="Xáo trộn"><i class="fa-solid fa-shuffle"></i></button>
                <button id="prev-btn" title="Bài trước"><i class="fa-solid fa-backward-step"></i></button>
                <button id="play-pause-btn" class="play-pause" title="Phát/Tạm dừng"><i class="fa-solid fa-play" id="play-icon"></i></button>
                <button id="next-btn" title="Bài tiếp theo"><i class="fa-solid fa-forward-step"></i></button>
                <button id="repeat-btn" title="Lặp lại"><i class="fa-solid fa-repeat"></i></button>
            </div>
            <div class="progress-container">
                <span id="current-time">0:00</span>
                <div class="progress-bar" id="progress-bar">
                    <div class="progress" id="progress"></div>
                </div>
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="player-right">
            <i class="fa-solid fa-volume-high" id="volume-icon"></i>
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
        </div>
    </div>

    <!-- Audio Element -->
    <audio id="audio-element"></audio>

    <script src="src/js/app.js"></script>
</body>
</html>
