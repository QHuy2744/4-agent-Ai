<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Android To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for modern icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <h1><i class="fa-solid fa-clipboard-list"></i> Việc Cần Làm</h1>
            <p id="date-display">Hôm nay</p>
        </header>

        <!-- Input Section -->
        <section class="input-section">
            <form id="todo-form">
                <input 
                    type="text" 
                    id="todo-input" 
                    placeholder="Thêm công việc mới..." 
                    autocomplete="off"
                    required
                >
                <button type="submit" id="add-btn" aria-label="Thêm công việc">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </form>
        </section>

        <!-- Filter Tabs -->
        <section class="filter-section">
            <button class="filter-btn active" data-filter="all">Tất cả</button>
            <button class="filter-btn" data-filter="active">Đang làm</button>
            <button class="filter-btn" data-filter="completed">Đã xong</button>
        </section>

        <!-- Tasks List Section -->
        <section class="list-section">
            <ul id="todo-list">
                <!-- Dynamic items will be injected here -->
            </ul>
            <div id="empty-state" class="empty-state hidden">
                <i class="fa-solid fa-face-smile"></i>
                <p>Không có công việc nào!</p>
            </div>
        </section>

        <!-- Footer Counter -->
        <footer class="app-footer">
            <span id="task-counter">0 công việc còn lại</span>
            <button id="clear-completed" class="clear-btn">Xóa đã xong</button>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
